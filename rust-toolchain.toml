# Pins the compiler the XCFramework is built with, and the Apple targets
# scripts/build-xcframework.sh needs. rustup reads this file; a bump here is a
# visible change to the tree, which is what makes a cached build invalidate.
[toolchain]
channel = "1.98.0"
targets = [
    "x86_64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-apple-ios",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
